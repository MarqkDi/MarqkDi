# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snake

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: MarqkDi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23a855f7&color_dots=%#7e224D,%23d8b4fe,%23c084fc,%23a855f7,%237e22ce
            dist/github-contribution-grid-snake.gif?color_snake=%23a855f7&color_dots=%#7e224D,%23d8b4fe,%23c084fc,%23a855f7,%237e22ce

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
